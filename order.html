<style>
*{box-sizing:border-box}
img{max-width:100%;height:auto}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:#F6F9F7;color:#234763;font-family:'Figtree',system-ui,sans-serif}
a{color:#234763}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #B4C04E;outline-offset:3px}
.ll-top{position:sticky;top:0;z-index:20;background:rgba(246,249,247,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #E1E8E3}
.ll-top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:24px}
.ll-top nav{display:none;flex:1;gap:28px;justify-content:center;font-weight:600}
.ll-top nav a{text-decoration:none}
@media (min-width:860px){.ll-top nav{display:flex}}
.ll-page-h1{margin:0;font-family:var(--ll-display);font-size:clamp(2.4rem,6vw,4.2rem);line-height:.98;font-weight:800;letter-spacing:-.035em}
.ll-foot{padding:28px 20px 40px;border-top:1px solid #E1E8E3}
.ll-foot-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;font-size:.9rem;color:#5A6E80}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
<link rel="stylesheet" href="assets/css/shop.css">
</head>
<body>
<div class="ll-top">
<div class="ll-top-in">
<a href="index.html" aria-label="Loom Lah home" style="display: block; flex: none"><img src="assets/logo.png" width="72" height="67" alt="Loom Lah" style="width: 72px; height: auto; display: block"></a>
<nav aria-label="Pages">
<a href="index.html#shop">Shop</a>
<a href="seconds.html">Seconds</a>
<a href="order.html">Track an order</a>
</nav>
<a class="ll-btn ll-btn-solid" href="index.html#shop" style="margin-left: auto; min-height: 44px; font-size: .95rem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>Shop</a>
</div>
</div>

<main style="padding: 48px 20px 88px">
<div style="max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
<h1 class="ll-page-h1" id="order-title">Your order</h1>

<div id="order-result" class="ll-panel ll-hide" aria-live="polite"></div>

<section id="order-lookup" class="ll-panel ll-hide" aria-labelledby="lookup-h">
<h2 id="lookup-h" style="margin: 0 0 6px; font-family: var(--ll-display); font-size: 1.6rem; font-weight: 800">Track an order</h2>
<p class="ll-small" style="margin: 0 0 18px; font-size: 1rem">Enter your order number (it starts with LL-) and the email you used at checkout.</p>
<form id="lookup-form" novalidate style="display: flex; flex-direction: column; gap: 14px">
<div class="ll-field"><label class="ll-label" for="lk-order">Order number</label><input id="lk-order" name="order" class="ll-input" placeholder="e.g. LL-1024" autocomplete="off" required></div>
<div class="ll-field"><label class="ll-label" for="lk-email">Email</label><input id="lk-email" name="email" type="email" class="ll-input" autocomplete="email" required></div>
<p id="lookup-error" class="ll-notice ll-notice-error ll-hide" role="alert"></p>
<button type="submit" class="ll-btn ll-btn-solid" style="align-self: flex-start">Find my order</button>
</form>
</section>
</div>
</main>

<footer class="ll-foot">
<div class="ll-foot-in">
<a href="index.html" style="font-weight: 700">Back to Loom Lah</a>
<span>© 2026 Loom Lah, Singapore · <a href="privacy.html">Privacy</a> · <a href="order.html">Track an order</a></span>
</div>
</footer>
<div id="ll-toast" class="ll-toast" role="status" aria-live="polite"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/analytics.js"></script>
<script src="assets/js/order.js"></script>
</body>
</html>
